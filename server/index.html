<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>Image/Manga Translator</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@unocss/reset/tailwind.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/petite-vue@0.4.1/dist/petite-vue.iife.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@unocss/runtime@0.30.5/uno.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@iconify/iconify@2.2.0/dist/iconify.min.js"></script>
    <style>
        [v-cloak],
        [un-cloak] {
            display: none;
        }
    </style>
</head>
<body>
<form
        action="#"
        class="flex py-8 w-full min-h-100vh justify-center items-center"
        @submit.prevent="onsubmit"
        @vue:mounted="onmounted"
        v-scope
        v-cloak
        un-cloak
>
    <div class="flex flex-col w-85ch h-full justify-center gap-2">
        <h1 class="text-center text-lg font-light">Image/Manga Translator</h1>
        <div class="flex mx-4 justify-start items-end">
            <div class="flex flex-wrap gap-4">
                <!-- 文本检测设置 -->
                <div class="flex items-center" title="检测分辨率">
                    <i class="iconify" data-icon="carbon:fit-to-screen"></i>
                    <div class="relative">
                        <select class="w-9ch appearance-none bg-transparent border-b border-gray-300"
                                v-model="detectionResolution">
                            <option value="1024">1024px</option>
                            <option value="1536">1536px</option>
                            <option value="2048">2048px</option>
                            <option value="2560">2560px</option>
                        </select>
                        <i class="iconify absolute top-1.5 right-1 pointer-events-none"
                           data-icon="carbon:chevron-down"></i>
                    </div>
                </div>
                <div class="flex items-center gap-1" title="文本检测器">
                    <i class="iconify" data-icon="carbon:search-locate"></i>
                    <div class="relative">
                        <select class="w-9ch appearance-none bg-transparent border-b border-gray-300"
                                v-model="textDetector">
                            <option value="default">默认</option>
                            <option value="dbconvnext">DBConvNext</option>
                            <option value="ctd">CTD</option>
                            <option value="craft">CRAFT</option>
                            <option value="paddle">Paddle</option>
                            <option value="none">无</option>
                        </select>
                        <i class="iconify absolute top-1.5 right-1 pointer-events-none"
                           data-icon="carbon:chevron-down"></i>
                    </div>
                </div>
                
                <div class="flex items-center gap-1" title="文本阈值">
                    <i class="iconify" data-icon="carbon:function-math"></i>
                    <span class="mr-1">文本阈值</span>
                    <input type="number" class="w-12ch appearance-none bg-transparent border-b border-gray-300"
                           v-model="textThreshold" min="0" max="1" step="0.05">
                </div>
                
                <div class="flex items-center gap-1" title="边框阈值">
                    <i class="iconify" data-icon="carbon:border-full"></i>
                    <span class="mr-1">边框阈值</span>
                    <input type="number" class="w-12ch appearance-none bg-transparent border-b border-gray-300"
                           v-model="boxThreshold" min="0" max="1" step="0.05">
                </div>
                
                <div class="flex items-center gap-1" title="展开比例">
                    <i class="iconify" data-icon="carbon:expand-categories"></i>
                    <span class="mr-1">展开比例</span>
                    <input type="number" class="w-12ch appearance-none bg-transparent border-b border-gray-300"
                           v-model="unclipRatio" min="1" max="5" step="0.1">
                </div>
                
                <div class="flex items-center gap-2">
                    <label class="flex items-center gap-1" title="旋转检测">
                        <input type="checkbox" v-model="detRotate" class="w-4 h-4">
                        <span>旋转检测</span>
                    </label>
                    
                    <label class="flex items-center gap-1" title="自动旋转">
                        <input type="checkbox" v-model="detAutoRotate" class="w-4 h-4">
                        <span>自动旋转</span>
                    </label>
                    
                    <label class="flex items-center gap-1" title="颜色反转">
                        <input type="checkbox" v-model="detInvert" class="w-4 h-4">
                        <span>颜色反转</span>
                    </label>
                    
                    <label class="flex items-center gap-1" title="伽马校正">
                        <input type="checkbox" v-model="detGammaCorrect" class="w-4 h-4">
                        <span>伽马校正</span>
                    </label>
                </div>
                
                <!-- 渲染设置 -->
                <div class="flex items-center gap-1" title="渲染器">
                    <i class="iconify" data-icon="carbon:pen"></i>
                    <div class="relative">
                        <select class="w-12ch appearance-none bg-transparent border-b border-gray-300"
                                v-model="renderer">
                            <option value="default">默认</option>
                            <option value="cairo">Cairo</option>
                            <option value="gimp">GIMP</option>
                            <option value="original">原始</option>
                        </select>
                        <i class="iconify absolute top-1.5 right-1 pointer-events-none"
                           data-icon="carbon:chevron-down"></i>
                    </div>
                </div>
                
                <div class="flex items-center gap-1" title="文本对齐">
                    <i class="iconify" data-icon="carbon:text-align-mixed"></i>
                    <div class="relative">
                        <select class="w-12ch appearance-none bg-transparent border-b border-gray-300"
                                v-model="textAlignment">
                            <option value="auto">自动</option>
                            <option value="left">左对齐</option>
                            <option value="center">居中</option>
                            <option value="right">右对齐</option>
                        </select>
                        <i class="iconify absolute top-1.5 right-1 pointer-events-none"
                           data-icon="carbon:chevron-down"></i>
                    </div>
                </div>
                
                <div class="flex items-center gap-1" title="渲染文本方向">
                    <i class="iconify" data-icon="carbon:text-align-left"></i>
                    <div class="relative">
                        <select class="w-12ch appearance-none bg-transparent border-b border-gray-300"
                                v-model="renderTextDirection">
                            <option value="auto">自动</option>
                            <option value="horizontal">水平</option>
                            <option value="vertical">垂直</option>
                        </select>
                        <i class="iconify absolute top-1.5 right-1 pointer-events-none"
                           data-icon="carbon:chevron-down"></i>
                    </div>
                </div>
                
                <div class="flex items-center gap-1" title="字体大小偏移">
                    <i class="iconify" data-icon="carbon:text-font"></i>
                    <span class="mr-1">字体偏移</span>
                    <input type="number" class="w-12ch appearance-none bg-transparent border-b border-gray-300"
                           v-model="fontSizeOffset" min="-10" max="10">
                </div>
                
                <div class="flex items-center gap-2">
                    <label class="flex items-center gap-1" title="禁用字体边框">
                        <input type="checkbox" v-model="disableFontBorder" class="w-4 h-4">
                        <span>禁用字体边框</span>
                    </label>
                    
                    <label class="flex items-center gap-1" title="全大写">
                        <input type="checkbox" v-model="textUppercase" class="w-4 h-4">
                        <span>全大写</span>
                    </label>
                    
                    <label class="flex items-center gap-1" title="全小写">
                        <input type="checkbox" v-model="textLowercase" class="w-4 h-4">
                        <span>全小写</span>
                    </label>
                    
                    <label class="flex items-center gap-1" title="禁用连字符">
                        <input type="checkbox" v-model="noHyphenation" class="w-4 h-4">
                        <span>禁用连字符</span>
                    </label>
                </div>
                
                <!-- 上采样设置 -->
                <div class="flex items-center gap-1" title="上采样器">
                    <i class="iconify" data-icon="carbon:image-service"></i>
                    <div class="relative">
                        <select class="w-12ch appearance-none bg-transparent border-b border-gray-300"
                                v-model="upscaler">
                            <option value="waifu2x">Waifu2x</option>
                            <option value="esrgan">ESRGAN</option>
                            <option value="4xultrasharp">4xUltraSharp</option>
                        </select>
                        <i class="iconify absolute top-1.5 right-1 pointer-events-none"
                           data-icon="carbon:chevron-down"></i>
                    </div>
                </div>
                
                <div class="flex items-center gap-1" title="上采样比例">
                    <span class="mr-1">上采样比例</span>
                    <input type="number" class="w-10ch appearance-none bg-transparent border-b border-gray-300"
                           v-model="upscaleRatio" min="1" max="4" step="1">
                </div>
                
                <label class="flex items-center gap-1" title="恢复原始尺寸">
                    <input type="checkbox" v-model="revertUpscaling" class="w-4 h-4">
                    <span>恢复原始尺寸</span>
                </label>
                
                <!-- 着色器设置 -->
                <div class="flex items-center gap-1" title="着色器">
                    <i class="iconify" data-icon="carbon:color-palette"></i>
                    <div class="relative">
                        <select class="w-10ch appearance-none bg-transparent border-b border-gray-300"
                                v-model="colorizer">
                            <option value="none">无</option>
                            <option value="mc2">MC2</option>
                        </select>
                        <i class="iconify absolute top-1.5 right-1 pointer-events-none"
                           data-icon="carbon:chevron-down"></i>
                    </div>
                </div>
                
                <div class="flex items-center gap-1" title="着色尺寸">
                    <span class="mr-1">着色尺寸</span>
                    <input type="number" class="w-10ch appearance-none bg-transparent border-b border-gray-300"
                           v-model="colorizationSize" min="256" max="1024" step="32">
                </div>
                
                <div class="flex items-center gap-1" title="降噪系数">
                    <span class="mr-1">降噪系数</span>
                    <input type="number" class="w-10ch appearance-none bg-transparent border-b border-gray-300"
                           v-model="denoiseSigma" min="0" max="100">
                </div>
                
                <!-- 修复器设置 -->
                <div class="flex items-center gap-1" title="修复器">
                    <i class="iconify" data-icon="carbon:paint-brush"></i>
                    <div class="relative">
                        <select class="w-12ch appearance-none bg-transparent border-b border-gray-300"
                                v-model="inpainter">
                            <option value="none">无</option>
                            <option value="default">默认</option>
                            <option value="lama_large">Lama大型</option>
                            <option value="lama_mpe">Lama MPE</option>
                            <option value="sd">SD</option>
                            <option value="original">原始</option>
                        </select>
                        <i class="iconify absolute top-1.5 right-1 pointer-events-none"
                           data-icon="carbon:chevron-down"></i>
                    </div>
                </div>
                
                <div class="flex items-center gap-1" title="修复尺寸">
                    <span class="mr-1">修复尺寸</span>
                    <input type="number" class="w-12ch appearance-none bg-transparent border-b border-gray-300"
                           v-model="inpaintingSize" min="512" max="4096" step="256">
                </div>
                
                <div class="flex items-center gap-1" title="修复精度">
                    <i class="iconify" data-icon="carbon:mathematical-statistics"></i>
                    <div class="relative">
                        <select class="w-8ch appearance-none bg-transparent border-b border-gray-300"
                                v-model="inpaintingPrecision">
                            <option value="fp32">FP32</option>
                            <option value="fp16">FP16</option>
                            <option value="bf16">BF16</option>
                        </select>
                        <i class="iconify absolute top-1.5 right-1 pointer-events-none"
                           data-icon="carbon:chevron-down"></i>
                    </div>
                </div>
                
                <!-- OCR设置 -->
                <div class="flex items-center gap-1" title="OCR模型">
                    <i class="iconify" data-icon="carbon:text-recognition"></i>
                    <div class="relative">
                        <select class="w-10ch appearance-none bg-transparent border-b border-gray-300"
                                v-model="ocrModel">
                            <option value="32px">32px</option>
                            <option value="48px">48px</option>
                            <option value="48px_ctc">48px CTC</option>
                            <option value="mocr">MOCR</option>
                        </select>
                        <i class="iconify absolute top-1.5 right-1 pointer-events-none"
                           data-icon="carbon:chevron-down"></i>
                    </div>
                </div>
                
                <div class="flex items-center gap-1" title="最小文本长度">
                    <span class="mr-1">最小文本长度</span>
                    <input type="number" class="w-10ch appearance-none bg-transparent border-b border-gray-300"
                           v-model="minTextLength" min="0" max="10">
                </div>
                
                <div class="flex items-center gap-1" title="忽略气泡">
                    <span class="mr-1">忽略气泡</span>
                    <input type="number" class="w-10ch appearance-none bg-transparent border-b border-gray-300"
                           v-model="ignoreBubble" min="0" max="10">
                </div>
                
                <label class="flex items-center gap-1" title="使用MOCR合并">
                    <input type="checkbox" v-model="useMocrMerge" class="w-4 h-4">
                    <span>使用MOCR合并</span>
                </label>
                
                <!-- 其他设置 -->
                <div class="flex items-center gap-1" title="核心大小">
                    <i class="iconify" data-icon="carbon:filter"></i>
                    <span class="mr-1">核心大小</span>
                    <input type="number" class="w-10ch appearance-none bg-transparent border-b border-gray-300"
                           v-model="kernelSize" min="1" max="10">
                </div>
                
                <div class="flex items-center gap-1" title="掩码扩张偏移">
                    <span class="mr-1">掩码扩张偏移</span>
                    <input type="number" class="w-10ch appearance-none bg-transparent border-b border-gray-300"
                           v-model="maskDilationOffset" min="-5" max="5">
                </div>
                
                <!-- 翻译设置 -->
                <div class="flex items-center gap-1" title="翻译器">
                    <i class="iconify" data-icon="carbon:operations-record"></i>
                    <div class="relative">
                        <select class="w-9ch appearance-none bg-transparent border-b border-gray-300"
                                v-model="translator">
                            <option v-for="key in validTranslators" :value="key">{{getTranslatorName(key)}}</option>
                        </select>
                        <i class="iconify absolute top-1.5 right-1 pointer-events-none"
                           data-icon="carbon:chevron-down"></i>
                    </div>
                </div>
                
                <div class="flex items-center gap-1" title="目标语言">
                    <i class="iconify" data-icon="carbon:language"></i>
                    <div class="relative">
                        <select class="w-15ch appearance-none bg-transparent border-b border-gray-300"
                                v-model="targetLanguage">
                            <option value="CHS">简体中文</option>
                            <option value="CHT">繁體中文</option>
                            <option value="JPN">日本語</option>
                            <option value="ENG">English</option>
                            <option value="KOR">한국어</option>
                            <option value="VIN">Tiếng Việt</option>
                            <option value="CSY">čeština</option>
                            <option value="NLD">Nederlands</option>
                            <option value="FRA">français</option>
                            <option value="DEU">Deutsch</option>
                            <option value="HUN">magyar nyelv</option>
                            <option value="ITA">italiano</option>
                            <option value="PLK">polski</option>
                            <option value="PTB">português</option>
                            <option value="ROM">limba română</option>
                            <option value="RUS">русский язык</option>
                            <option value="ESP">español</option>
                            <option value="TRK">Türk dili</option>
                            <option value="IND">Indonesia</option>
                        </select>
                        <i class="iconify absolute top-1.5 right-1 pointer-events-none"
                           data-icon="carbon:chevron-down"></i>
                    </div>
                </div>
            </div>
        </div>
        <div v-if="result" class="flex flex-col items-center">
            <img class="my-2" :src="resultUri"/>
            <button class="px-2 py-1 text-center rounded-md text-blue-800 border-2 border-blue-300" @click="clear">
                Upload another
            </button>
        </div>
        <div v-else-if="status"
             class="grid w-full h-116 place-content-center rounded-2xl border-2 border-dashed border-gray-600">
            <div v-if="error" class="flex flex-col items-center gap-2">
                <div style="color: crimson">{{ statusText }}</div>
                <button class="px-2 py-1 text-center rounded-md text-blue-800 border-2 border-blue-300" @click="clear">
                    Upload another
                </button>
            </div>
            <div v-else class="flex flex-col items-center gap-2">
                <i class="iconify w-8 h-8 text-gray-500 animate-spin" data-icon="carbon:progress-bar-round"></i>
                <div>{{ statusText }}</div>
            </div>
        </div>
        <label
                v-else
                class="grid w-full h-116 place-content-center rounded-2xl border-2 border-dashed border-gray-600 cursor-pointer"
                for="file"
                @dragenter.prevent
                @dragover.prevent
                @dragleave.prevent
                @drop.prevent="ondrop"
        >
            <div v-if="file" class="flex flex-col items-center gap-2">
                <div><span class="iconify-inline inline-block mr-2 scale-125" data-icon="carbon:image-search"></span>File
                    Preview
                </div>
                <img class="max-w-72 max-h-72" :src="fileUri"/>
                <button type="submit" class="px-2 py-1 rounded-md text-blue-800 border-2 border-blue-300">Translate
                </button>
                <div class="text-sm text-gray-600">Click the empty space or paste/drag a new one to replace</div>
            </div>
            <div v-else class="flex flex-col items-center gap-2">
                <i class="iconify w-8 h-8 text-gray-500" data-icon="carbon:cloud-upload"></i>
                <div>Paste an image, click to select one or drag and drop here</div>
            </div>
            <input id="file" type="file" accept="image/png,image/jpeg,image/bmp,image/webp" class="hidden"
                   @change="onfilechange"/>
        </label>
        <div class="flex justify-center gap-2">
            <div>
                Please consider supporting us by
                <a class="underline underline-blue-400" href="https://ko-fi.com/voilelabs" target="_blank"
                   rel="noopener noreferrer">Ko-fi</a>
                or
                <a class="underline underline-blue-400" href="https://www.patreon.com/voilelabs" target="_blank"
                   rel="noopener noreferrer"
                >Patreon</a
                >!
            </div>
            <a
                    class="underline underline-blue-400"
                    href="https://github.com/zyddnys/manga-image-translator"
                    target="_blank"
                    rel="noopener noreferrer"
            >Source Code</a
            >
        </div>
    </div>
</form>
<script>
    const BASE_URI = '/'
    const acceptTypes = ['image/png', 'image/jpeg', 'image/bmp', 'image/webp']

    function formatSize(bytes) {
        const k = 1024
        const sizes = ['B', 'KB', 'MB', 'GB', 'TB']
        if (bytes === 0) return '0B'
        const i = Math.floor(Math.log(bytes) / Math.log(k))
        return `${(bytes / k ** i).toFixed(2)}${sizes[i]}`
    }

    function formatProgress(loaded, total) {
        return `${formatSize(loaded)}/${formatSize(total)}`
    }

    PetiteVue.createApp({
        onmounted() {
            window.addEventListener('paste', this.onpaste)
        },

        file: null,
        get fileUri() {
            return this.file ? URL.createObjectURL(this.file) : null
        },
        detectionResolution: '1536',
        textDetector: 'default',
        textThreshold: 0.5,
        boxThreshold: 0.7,
        unclipRatio: 2.3,
        detRotate: false,
        detAutoRotate: false,
        detInvert: false,
        detGammaCorrect: false,
        
        renderer: 'default',
        textAlignment: 'auto',
        renderTextDirection: 'auto',
        fontSizeOffset: 0,
        disableFontBorder: false,
        textUppercase: false,
        textLowercase: false,
        noHyphenation: false,
        
        upscaler: 'esrgan',
        upscaleRatio: null,
        revertUpscaling: false,
        
        colorizer: 'none',
        colorizationSize: 576,
        denoiseSigma: 30,
        
        inpainter: 'none',
        inpaintingSize: 2048,
        inpaintingPrecision: 'fp32',
        
        ocrModel: '48px',
        minTextLength: 0,
        ignoreBubble: 0,
        useMocrMerge: false,
        
        kernelSize: 3,
        maskDilationOffset: 0,
        
        translator: 'youdao',
        validTranslators: ['youdao', 'baidu', 'deepl', 'papago', 'caiyun', 'sakura', 'offline', 'gpt3.5', 'deepseek', 'none'],
        getTranslatorName(key) {
            if (key === 'none')
                return "No Text"
            return key ? key[0].toUpperCase() + key.slice(1) : "";
        },
        targetLanguage: 'CHS',
        ondrop(e) {
            const file = e.dataTransfer?.files?.[0]
            if (file && acceptTypes.includes(file.type)) {
                this.file = file
            }
        },
        onfilechange(e) {
            const file = e.target.files?.[0]
            if (file && acceptTypes.includes(file.type)) {
                this.file = file
            }
        },
        onpaste(e) {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items
            for (const item of items) {
                if (item.kind === 'file') {
                    const file = item.getAsFile()
                    if (!file || !acceptTypes.includes(file.type)) continue
                    this.file = file
                }
            }
        },

        progress: null,
        status: null,
        queuePos: null,
        cachedStatusText: '',
        get statusText() {
            var newStatusText = this._statusText
            if (newStatusText != null && newStatusText != this.cachedStatusText) {
                this.cachedStatusText = newStatusText
            }
            return this.cachedStatusText
        },
        get _statusText() {
            switch (this.status) {
                case 'upload': {
                    if (this.progress) {
                        return `Uploading (${this.progress})`
                    } else {
                        return 'Uploading'
                    }
                }
                case 'pending':
                    if (this.queuePos) {
                        return `Queuing, your position is ${this.queuePos}`
                    } else {
                        return 'Processing'
                    }
                case 'detection':
                    return 'Detecting texts'
                case 'ocr':
                    return 'Running OCR'
                case 'mask-generation':
                    return 'Generating text mask'
                case 'inpainting':
                    return 'Running inpainting'
                case 'upscaling':
                    return 'Running upscaling'
                case 'translating':
                    return 'Translating'
                case 'rendering':
                    return 'Rendering translated texts'
                case 'finished':
                    return 'Downloading image'
                case 'error':
                    return 'Something went wrong, please try again'
                case 'error-upload':
                    return 'Upload failed, please try again'
                case 'error-lang':
                    return 'Your target language is not supported by the chosen translator'
                case 'error-translating':
                    return 'Did not get any text back from the text translation service'
                case 'error-too-large':
                    return 'Image size too large (greater than 8000x8000 px)'
                case 'error-disconnect':
                    return 'Lost connection to server'
            }
        },
        get error() {
            return /^error/.test(this.status)
        },
        result: null,
        get resultUri() {
            return this.result ? URL.createObjectURL(this.result) : null
        },
        onsubmit(e) {
            if (!this.file) return

            this.progress = null
            this.queuePos = null
            this.status = 'upload'
            let buffer = new Uint8Array();

            const formData = new FormData()
            formData.append('image', this.file)

            const config = `{
                "detector": {
                    "detector": "${this.textDetector}",
                    "detection_size": ${this.detectionResolution},
                    "text_threshold": ${this.textThreshold},
                    "box_threshold": ${this.boxThreshold},
                    "unclip_ratio": ${this.unclipRatio},
                    "det_rotate": ${this.detRotate},
                    "det_auto_rotate": ${this.detAutoRotate},
                    "det_invert": ${this.detInvert},
                    "det_gamma_correct": ${this.detGammaCorrect}
                },
                "render": {
                    "renderer": "${this.renderer}",
                    "alignment": "${this.textAlignment}",
                    "disable_font_border": ${this.disableFontBorder},
                    "font_size_offset": ${this.fontSizeOffset},
                    "direction": "${this.renderTextDirection}",
                    "uppercase": ${this.textUppercase},
                    "lowercase": ${this.textLowercase},
                    "no_hyphenation": ${this.noHyphenation}
                },
                "upscale": {
                    "upscaler": "${this.upscaler}",
                    "revert_upscaling": ${this.revertUpscaling},
                    "upscale_ratio": ${this.upscaleRatio === null ? 'null' : this.upscaleRatio}
                },
                "translator": {
                    "translator": "${this.translator}",
                    "target_lang": "${this.targetLanguage}"
                },
                "colorizer": {
                    "colorizer": "${this.colorizer}",
                    "colorization_size": ${this.colorizationSize},
                    "denoise_sigma": ${this.denoiseSigma}
                },
                "inpainter": {
                    "inpainter": "${this.inpainter}",
                    "inpainting_size": ${this.inpaintingSize},
                    "inpainting_precision": "${this.inpaintingPrecision}"
                },
                "ocr": {
                    "ocr": "${this.ocrModel}",
                    "min_text_length": ${this.minTextLength},
                    "ignore_bubble": ${this.ignoreBubble},
                    "use_mocr_merge": ${this.useMocrMerge}
                },
                "kernel_size": ${this.kernelSize},
                "mask_dilation_offset": ${this.maskDilationOffset}
            }`;

            formData.append('config', config)
            
            const processChunk = (value) => {
                if (this.error) return;

                const newBuffer = new Uint8Array(buffer.length + value.length);
                newBuffer.set(buffer);
                newBuffer.set(value, buffer.length);
                buffer = newBuffer;

                while (buffer.length >= 5) {
                    const dataSize = new DataView(buffer.buffer).getUint32(1, false);
                    const totalSize = 5 + dataSize;
                    if (buffer.length < totalSize) {
                        break;
                    }

                    const statusCode = buffer[0];
                    const decoder = new TextDecoder('utf-8');
                    const data = buffer.slice(5, totalSize);
                    switch (statusCode) {
                        case 0:
                            this.result = new Blob([data], {type: 'image/png'});
                            this.status = null;
                            break;
                        case 1:
                            this.status = decoder.decode(data);
                            break;
                        case 2:
                            this.status = "error";
                            console.error(decoder.decode(data));
                            break;
                        case 3:
                            this.status = 'pending';
                            this.queuePos = decoder.decode(data);
                            break;
                        case 4:
                            this.status = 'pending';
                            this.queuePos = null;
                            break;
                    }
                    buffer = buffer.slice(totalSize);
                }
            }
            const uploadWithProgress = async (formData) => {
                try {
                    const response = await fetch(`${BASE_URI}translate/with-form/image/stream`, {
                        method: 'POST',
                        body: formData,
                    });

                    if (response.status !== 200) {
                        this.status = 'error-upload';
                        this.status = 'pending';
                        return;
                    }

                    const reader = response.body.getReader();
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        processChunk(value);
                    }
                } catch (error) {
                    console.error(error);
                    this.status = 'error-disconnect';
                }
            }

            uploadWithProgress(formData);
        },
        clear() {
            this.file = null
            this.result = null
            this.status = null
        },
    }).mount()
</script>
</body>
</html>
